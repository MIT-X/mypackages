name: Sync
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync OpenAppFilter
        run: |
          git clone --depth 1 https://github.com/destan19/OpenAppFilter.git /tmp/oaf || true
          if [ -d "/tmp/oaf" ]; then
            rm -rf OpenAppFilter
            mkdir -p OpenAppFilter
            cp -r /tmp/oaf/* OpenAppFilter/
            rm -rf OpenAppFilter/.git
          fi

      - name: Sync luci-app-bandix
        run: |
          git clone --depth 1 https://github.com/timsaya/luci-app-bandix.git /tmp/bandix || true
          if [ -d "/tmp/bandix" ]; then
            rm -rf luci-app-bandix
            mkdir -p luci-app-bandix
            cp -r /tmp/bandix/* luci-app-bandix/
            rm -rf luci-app-bandix/.git
          fi

      - name: Sync luci-app-gecoosac
        run: |
          git clone --depth 1 https://github.com/laipeng668/luci-app-gecoosac.git /tmp/gecoosac || true
          if [ -d "/tmp/gecoosac" ]; then
            rm -rf luci-app-gecoosac
            mkdir -p luci-app-gecoosac
            cp -r /tmp/gecoosac/* luci-app-gecoosac/
            rm -rf luci-app-gecoosac/.git
          fi

      - name: Sync luci-app-upnp (from VIKINGYFY/packages)
        run: |
          git clone --depth 1 https://github.com/VIKINGYFY/packages.git /tmp/viking || true
          if [ -d "/tmp/viking/luci-app-upnp" ]; then
            rm -rf luci-app-upnp
            mkdir -p luci-app-upnp
            cp -r /tmp/viking/luci-app-upnp/* luci-app-upnp/
            rm -rf luci-app-upnp/.git
          fi

      - name: Sync miniupnpd (from VIKINGYFY/packages)
        run: |
          git clone --depth 1 https://github.com/VIKINGYFY/packages.git /tmp/viking2 || true
          if [ -d "/tmp/viking2/miniupnpd" ]; then
            rm -rf miniupnpd
            mkdir -p miniupnpd
            cp -r /tmp/viking2/miniupnpd/* miniupnpd/
            rm -rf miniupnpd/.git
          fi

      - name: Sync luci-app-lanspeed
        run: |
          git clone --depth 1 https://github.com/qimaoww/luci-app-lanspeed.git /tmp/lanspeed || true
          if [ -d "/tmp/lanspeed" ]; then
            rm -rf luci-app-lanspeed
            mkdir -p luci-app-lanspeed
            cp -r /tmp/lanspeed/* luci-app-lanspeed/
            rm -rf luci-app-lanspeed/.git
          fi

      - name: Sync openwrt-passwall2
        run: |
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/pw2 || true
          if [ -d "/tmp/pw2" ]; then
            rm -rf openwrt-passwall2
            mkdir -p openwrt-passwall2
            cp -r /tmp/pw2/* openwrt-passwall2/
            rm -rf openwrt-passwall2/.git
          fi

      - name: Sync openwrt-passwall-packages
        run: |
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git /tmp/pwpkg || true
          if [ -d "/tmp/pwpkg" ]; then
            rm -rf openwrt-passwall-packages
            mkdir -p openwrt-passwall-packages
            cp -r /tmp/pwpkg/* openwrt-passwall-packages/
            rm -rf openwrt-passwall-packages/.git
          fi

      - name: Sync luci-app-honk
        run: |
          git clone --depth 1 https://github.com/QiuSimons/luci-app-honk.git /tmp/honk || true
          if [ -d "/tmp/honk" ]; then
            rm -rf luci-app-honk
            mkdir -p luci-app-honk
            cp -r /tmp/honk/* luci-app-honk/
            rm -rf luci-app-honk/.git
          fi

      - name: Sync luci-app-daed
        run: |
          git clone --depth 1 https://github.com/QiuSimons/luci-app-daed.git /tmp/daed-luci || true
          if [ -d "/tmp/daed-luci" ]; then
            rm -rf luci-app-daed
            mkdir -p luci-app-daed
            cp -r /tmp/daed-luci/* luci-app-daed/
            rm -rf luci-app-daed/.git
          fi

      - name: Sync luci-app-mesh
        run: |
          git clone --depth 1 https://github.com/EricYin/luci-app-mesh.git /tmp/mesh || true
          if [ -d "/tmp/mesh" ]; then
            rm -rf luci-app-mesh
            mkdir -p luci-app-mesh
            cp -r /tmp/mesh/* luci-app-mesh/
            rm -rf luci-app-mesh/.git
          fi

      - name: Sync dae
        run: |
          git clone --depth 1 https://github.com/daeuniverse/dae.git /tmp/dae || true
          if [ -d "/tmp/dae" ]; then
            rm -rf dae
            mkdir -p dae
            cp -r /tmp/dae/* dae/
            rm -rf dae/.git
          fi

      - name: Sync daed
        run: |
          git clone --depth 1 https://github.com/daeuniverse/daed.git /tmp/daed-core || true
          if [ -d "/tmp/daed-core" ]; then
            rm -rf daed
            mkdir -p daed
            cp -r /tmp/daed-core/* daed/
            rm -rf daed/.git
          fi

      - name: Commit & Push changes
        run: |
          git add \
            OpenAppFilter \
            luci-app-bandix \
            luci-app-gecoosac \
            luci-app-upnp \
            miniupnpd \
            luci-app-lanspeed \
            openwrt-passwall2 \
            openwrt-passwall-packages \
            luci-app-honk \
            dae \
            daed
            luci-app-daed \
            luci-app-mesh

          git diff --cached --quiet || {
            git commit -m "🔄 $(date -u '+%Y-%m-%d')"
            git push origin main
          }
